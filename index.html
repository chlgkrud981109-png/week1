<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌳 결정의 숲 - 당신의 독립 선언</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <h1>🌳 결정의 숲</h1>
        <p>당신의 독립 선언</p>
    </header>

    <main id="chat-window" class="chat-window">
        <!-- AI Greeting -->
        <div class="message ai">
            <div class="bubble">
                어서 오세요. 이곳은 당신의 내면과 마주하는 '결정의 숲'입니다. 
                지금 당신의 발걸음을 무겁게 만드는 그 고민은 무엇인가요?
            </div>
        </div>
    </main>

    <footer class="input-area">
        <form id="chat-form">
            <input type="text" id="user-input" placeholder="고민의 실타래를 꺼내어보세요..." autocomplete="off">
            <button type="submit" id="send-btn">
                <svg viewBox="0 0 24 24" width="24" height="24">
                    <path fill="currentColor" d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path>
                </svg>
            </button>
        </form>
    </footer>

    <script type="module" src="main.js"></script>
</body>
</html>
